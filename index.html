<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="Program Rimba — body recomposition tracker">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<title>Program Rimba</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#167c4b;--bad:#b42318;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding-bottom:92px}.top{padding:20px 16px 8px}.brand{font-size:24px;font-weight:800}.sub{color:var(--muted);font-size:13px}.view{padding:8px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:0 2px 10px #1111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric b{display:block;font-size:23px}.metric span{color:var(--muted);font-size:12px}.section-title{font-size:17px;font-weight:800;margin:20px 2px 8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef0f4;font-size:12px}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:#eef0f4;color:var(--text)}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:#fff;padding:10px 4px;color:var(--muted);font-size:12px}.nav button.active{color:#111;font-weight:800}.nav .ico{font-size:20px;display:block}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.item h4{margin:0 0 3px}.item p{margin:3px 0;color:var(--muted);font-size:13px}.bar{height:9px;background:#edf0f4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#111827;border-radius:99px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.sets{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.setrow{display:grid;grid-template-columns:35px 1fr 1fr 34px;gap:6px;align-items:center;margin:5px 0}.setrow input{padding:8px;border:1px solid var(--line);border-radius:9px;width:100%}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;z-index:50;font-size:13px}.empty{padding:25px;text-align:center;color:var(--muted)}canvas{width:100%;height:220px;border:1px solid var(--line);border-radius:14px;background:#fff}.smallnote{font-size:12px;color:var(--muted)}
</style></head>
<body><div id="app"><div style="max-width:760px;margin:40px auto;padding:20px;font-family:system-ui">Memuat Program Rimba…</div></div><script>
window.addEventListener('error',function(e){
  var box=document.getElementById('app');
  if(box) box.innerHTML='<div style="max-width:760px;margin:40px auto;padding:20px;font-family:system-ui"><h2>Program Rimba belum bisa dimuat</h2><p>JavaScript mengalami error.</p><pre style="white-space:pre-wrap;background:#f3f4f6;padding:12px;border-radius:12px">'+String(e.message||e.error||'Unknown error')+'</pre><p style="color:#6b7280">Screenshot bagian ini kalau muncul, lalu kirim ke ChatGPT.</p></div>';
});
</script><script src="app.js?v=2"></script></body></html>
